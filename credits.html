<!DOCTYPE html>
<html lang="en">
<head>
  <title>Credits</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('purple.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      color: #8e44ad; /* vibrant purple */
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      min-height: 100vh;
    }

    .title-box {
      background-color: rgba(40,0,60,0.9); /* deep purple */
      border: 2px solid #8e44ad;
      border-radius: 12px;
      box-shadow: 0 0 25px #8e44ad;
      padding: 30px 60px;
      margin: 40px 0;
      text-align: center;
    }

    .title-box h1 {
      font-size: 3em;
      color: #8e44ad;
      margin: 0;
      text-shadow: 0 0 15px #8e44ad;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 80%;
      padding: 20px;
    }

    .box {
      background-color: rgba(40,0,60,0.9);
      border: 2px solid #8e44ad;
      border-radius: 12px;
      box-shadow: 0 0 20px #8e44ad;
      padding: 20px;
      font-size: 1.2em;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .box:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px #8e44ad;
    }

    /* Home button */
    .home-btn {
      margin: 40px 0;
      padding: 15px 30px;
      font-size: 1.4em;
      color: #8e44ad;
      background-color: rgba(40,0,60,0.9);
      border: 2px solid #8e44ad;
      border-radius: 10px;
      box-shadow: 0 0 20px #8e44ad;
      text-decoration: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .home-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px #8e44ad;
    }
  </style>
</head>
<body>

  <div class="title-box">
    <h1>Credits</h1>
  </div>

  <div class="container">
    <div class="box">
      <p><strong>Jade Imperial</strong> – providing photos for the events and our Noli video!</p>
    </div>

    <div class="box">
      <p><strong>Ms. Grace</strong> – providing the lessons to add for our browser outputs and 4th quarter lesson tab!</p>
    </div>

    <div class="box">
      <p><strong>Sir Calimbas</strong> – providing our AP lessons and teaching it to us :DD</p>
    </div>

    <div class="box">
      <p><strong>Pinterest</strong> – providing background for my websites!</p>
    </div>
  </div>


</body>
</html>
